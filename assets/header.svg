<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1a1446"/>
      <stop offset="1" stop-color="#2b1a5e">
        <animate attributeName="stop-color" values="#2b1a5e;#123a5a;#2b1a5e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <clipPath id="type">
      <rect x="64" y="226" height="30" width="0">
        <animate attributeName="width" values="0;720;720;0" keyTimes="0;0.45;0.9;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace}
      .sans{font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR','Segoe UI',Helvetica,Arial,sans-serif}
      .pulse{animation:pulse 3s ease-in-out infinite}
      .p2{animation-delay:1s}.p3{animation-delay:2s}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:flow 2.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-32}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="960" cy="150" r="230" fill="url(#glow)"/>

  <!-- chain of blocks -->
  <g stroke="url(#accent)" stroke-width="2" fill="none" class="flow">
    <path d="M790 100 L900 160 L1020 110 L1120 190"/>
    <path d="M900 160 L960 250 L1080 250"/>
  </g>
  <g fill="#0b1020" stroke="url(#accent)" stroke-width="2">
    <rect x="770" y="80" width="40" height="40" rx="8"/>
    <rect x="880" y="140" width="40" height="40" rx="8"/>
    <rect x="1000" y="90" width="40" height="40" rx="8"/>
    <rect x="1100" y="170" width="40" height="40" rx="8"/>
    <rect x="940" y="230" width="40" height="40" rx="8"/>
    <rect x="1060" y="230" width="40" height="40" rx="8"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="790" cy="100" r="5" class="pulse"/>
    <circle cx="900" cy="160" r="5" class="pulse p2"/>
    <circle cx="1020" cy="110" r="5" class="pulse p3"/>
    <circle cx="1120" cy="190" r="5" class="pulse"/>
    <circle cx="960" cy="250" r="5" class="pulse p2"/>
    <circle cx="1080" cy="250" r="5" class="pulse p3"/>
  </g>
  <!-- lock on the frozen block -->
  <g transform="translate(1009 98)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round">
    <rect x="3" y="10" width="16" height="12" rx="2" fill="#7c5cff" stroke="none"/>
    <path d="M6 10 V7 a5 5 0 0 1 10 0 V10"/>
  </g>

  <!-- text -->
  <text x="64" y="84" class="mono" font-size="16" fill="#22d3ee" letter-spacing="1">// smart contract · blockchain · stablecoin</text>
  <text x="62" y="152" class="sans" font-size="60" font-weight="800" fill="#ffffff">Jungun Park</text>
  <text x="66" y="194" class="sans" font-size="22" fill="#c7c9ff">박정언 · Fintech Lab undergraduate researcher</text>
  <rect x="64" y="212" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <g clip-path="url(#type)">
    <text x="64" y="248" class="mono" font-size="17" fill="#e5e7eb">require(verifier.verifyProof(proof, [root, commitment, target]));</text>
  </g>
</svg>
